name: Build Voice App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter and ZEGOCLOUD
        run: |
          flutter create --org com.voice.app --project-name voice_app .
          flutter pub add zego_uikit_prebuilt_live_audio_room
          cat << 'EOF' > setup.py
          import os

          # 1. حل مكتبة zego_zim
          for s_path in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s_path):
                  with open(s_path, "r") as f:
                      content = f.read()
                  if "com.android.application" in content and "com.android.library" not in content:
                      lines = content.splitlines()
                      new_lines = []
                      for line in lines:
                          new_lines.append(line)
                          if "com.android.application" in line:
                              new_lines.append(line.replace("com.android.application", "com.android.library"))
                      with open(s_path, "w") as f:
                          f.write("\n".join(new_lines) + "\n")

          # 2. أذونات المايك والشبكة
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  data = f.read()
              perms = """
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              """
              if "RECORD_AUDIO" not in data:
                  data = data.replace("<application", perms + "\n    <application")
                  with open(manifest_path, "w") as f:
                      f.write(data)

          # 3. إعدادات إصدار أندرويد
          for p in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(p):
                  with open(p, "r") as f:
                      txt = f.read()
                  txt = txt.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
                  txt = txt.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
                  txt = txt.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
                  txt = txt.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 34")
                  with open(p, "w") as f:
                      f.write(txt)

          # 4. قواعد الحماية
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/proguard-rules.pro", "a") as f:
              f.write("\n-keep class **.zego.** { *; }\n-keep class **.**.zego_zpns.** { *; }\n")

          # 5. إيقاف newDsl و builtInKotlin وتفعيل التوافق الكامل كما طلبت رسالة الخطأ
          gp_path = "android/gradle.properties"
          if os.path.exists(gp_path):
              with open(gp_path, "r") as f:
                  gp = f.read()
          else:
              gp = ""

          flags = [
              "android.useAndroidX=true",
              "android.enableJetifier=true",
              "android.nonTransitiveRClass=false",
              "android.newDsl=false",
              "android.builtInKotlin=false"
          ]
          for flg in flags:
              k = flg.split("=")[0]
              if k in gp:
                  gp = "\n".join([flg if l.startswith(k + "=") else l for l in gp.splitlines()])
              else:
                  gp += f"\n{flg}\n"

          with open(gp_path, "w") as f:
              f.write(gp)
          EOF
          python3 setup.py

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceApp-Release
          path: build/app/outputs/flutter-apk/app-release.apk
