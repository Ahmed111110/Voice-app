name: Build Voice App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter and ZEGOCLOUD
        run: |
          flutter create --org com.voice.app --project-name voice_app .
          flutter pub add zego_uikit_prebuilt_live_audio_room
          cat << 'EOF' > setup.py
          import os

          # 1. استبدال مستودع jcenter() القديم بمستودع mavenCentral() المعتمد
          pub_cache = os.path.expanduser("~/.pub-cache")
          for search_dir in [pub_cache, "android"]:
              if os.path.exists(search_dir):
                  for root, _, files in os.walk(search_dir):
                      for file in files:
                          if file.endswith((".gradle", ".kts")):
                              fp = os.path.join(root, file)
                              try:
                                  with open(fp, "r", encoding="utf-8") as f:
                                      c = f.read()
                                  if "jcenter()" in c:
                                      with open(fp, "w", encoding="utf-8") as f:
                                        f.write(c.replace("jcenter()", "mavenCentral()"))
                              except Exception:
                                  pass

          # 2. حل مشكلة تعريف المكتبة com.android.library
          for s_path in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s_path):
                  with open(s_path, "r") as f:
                      content = f.read()
                  if "com.android.application" in content and "com.android.library" not in content:
                      lines = content.splitlines()
                      new_lines = []
                      for line in lines:
                          new_lines.append(line)
                          if "com.android.application" in line:
                              new_lines.append(line.replace("com.android.application", "com.android.library"))
                      with open(s_path, "w") as f:
                          f.write("\n".join(new_lines) + "\n")

          # 3. ضبط compileSdk إلى 36 و minSdk إلى 21 لتوافق الحزم بالكامل
          for p in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(p):
                  with open(p, "r") as f:
                      txt = f.read()
                  txt = txt.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
                  txt = txt.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
                  txt = txt.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
                  txt = txt.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  txt = txt.replace("compileSdkVersion 34", "compileSdkVersion 36")
                  txt = txt.replace("compileSdk = 34", "compileSdk = 36")
                  with open(p, "w") as f:
                      f.write(txt)

          # 4. صلاحيات المايكروفون والشبكة
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  data = f.read()
              perms = """
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              """
              if "RECORD_AUDIO" not in data:
                  data = data.replace("<application", perms + "\n    <application")
                  with open(manifest_path, "w") as f:
                      f.write(data)

          # 5. قواعد الحماية
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/proguard-rules.pro", "a") as f:
              f.write("\n-keep class **.zego.** { *; }\n-keep class **.**.zego_zpns.** { *; }\n")

          # 6. خصائص AndroidX
          gp_path = "android/gradle.properties"
          if os.path.exists(gp_path):
              with open(gp_path, "r") as f:
                  gp = f.read()
          else:
              gp = ""
          flags = [
              "android.useAndroidX=true",
              "android.enableJetifier=true",
              "android.nonTransitiveRClass=false"
          ]
          for flg in flags:
              k = flg.split("=")[0]
              if k not in gp:
                  gp += f"\n{flg}\n"
          with open(gp_path, "w") as f:
              f.write(gp)
          EOF
          python3 setup.py

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceApp-Release
          path: build/app/outputs/flutter-apk/app-release.apk
